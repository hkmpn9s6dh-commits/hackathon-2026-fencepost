[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fencepost"
version = "0.1.0"
description = "Contract-drift auditor agent built on the OpenMinion 0.1 Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Zhang Yi" }]
keywords = ["agent", "openminion", "documentation", "audit", "drift"]
dependencies = [
  "openminion>=0.1.22",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fencepost = "fencepost.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fencepost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
